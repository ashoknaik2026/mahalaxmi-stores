<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mahalaxmi Stationary Stores</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            color: #222;
        }

        header {
            background: #1f4e79;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        header p {
            font-size: 16px;
        }

        .search {
            text-align: center;
            padding: 25px;
            background: white;
        }

        .search input {
            width: 80%;
            max-width: 600px;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .section-title {
            margin-bottom: 20px;
            font-size: 26px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .product {
            background: white;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .product-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .product h3 {
            margin-bottom: 10px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .button {
            background: #1f4e79;
            color: white;
            border: none;
            padding: 11px 18px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
        }

        .button:hover {
            background: #163a5c;
        }

        footer {
            margin-top: 50px;
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>🏪 Mahalaxmi Stationary Stores</h1>
    <p>Your local stationery shop</p>
</header>

<div class="search">
    <input type="text" placeholder="🔍 Search stationery products...">
</div>

<div class="container">

    <h2 class="section-title">Our Products</h2>

    <div class="products">

        <div class="product">
            <div class="product-icon">🖊️</div>
            <h3>Ball Pen</h3>
            <p class="price">₹10</p>
            <button class="button"
                onclick="orderOnWhatsApp('Ball Pen', 10)">
                Order on WhatsApp
            </button>
        </div>

        <div class="product">
            <div class="product-icon">📓</div>
            <h3>Notebook</h3>
            <p class="price">₹50</p>
            <button class="button"
                onclick="orderOnWhatsApp('Notebook', 50)">
                Order on WhatsApp
            </button>
        </div>

        <div class="product">
            <div class="product-icon">✏️</div>
            <h3>Pencil</h3>
            <p class="price">₹5</p>
            <button class="button"
                onclick="orderOnWhatsApp('Pencil', 5)">
                Order on WhatsApp
            </button>
        </div>

        <div class="product">
            <div class="product-icon">🧽</div>
            <h3>Eraser</h3>
            <p class="price">₹5</p>
            <button class="button"
                onclick="orderOnWhatsApp('Eraser', 5)">
                Order on WhatsApp
            </button>
        </div>

        <div class="product">
            <div class="product-icon">🔪</div>
            <h3>Sharpener</h3>
            <p class="price">₹10</p>
            <button class="button"
                onclick="orderOnWhatsApp('Sharpener', 10)">
                Order on WhatsApp
            </button>
        </div>

    </div>

</div>

<footer>
    <p>© 2026 Mahalaxmi Stationary Stores | Stationery & School Supplies</p>
</footer>

<script>
    const whatsappNumber = "919900683833";

    function orderOnWhatsApp(product, price) {
        const message =
            `Hello Mahalaxmi Stationary Stores, I want to order ${product} for ₹${price}.`;

        const url =
            `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`;

        window.open(url, "_blank");
    }
</script>

</body>
</html>
